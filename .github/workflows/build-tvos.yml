name: Build Moonlight Plus tvOS

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tvos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Show selected Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build unsigned tvOS application
        run: bash BuildScripts/build-tvos.sh '${{ matrix.configuration }}'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-${{ matrix.configuration }}-diagnostics
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: ignore
      - name: Upload unsigned device app
        uses: actions/upload-artifact@v4
        with:
          name: tvos-${{ matrix.configuration }}-unsigned
          path: build/DerivedData/Build/Products/${{ matrix.configuration }}-appletvos/*.app
          if-no-files-found: error
