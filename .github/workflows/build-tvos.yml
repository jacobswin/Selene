name: Build Selene tvOS

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tvos:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select an installed Xcode 26 or newer
        shell: bash
        run: |
          selected_xcode=""
          selected_version=0
          for candidate in /Applications/Xcode*.app; do
            candidate_dir="$candidate/Contents/Developer"
            candidate_version=$(DEVELOPER_DIR="$candidate_dir" xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]*1000000+v[2]*1000+v[3]}')
            if [[ "$candidate_version" =~ ^[0-9]+$ ]] && (( candidate_version >= 26000000 && candidate_version > selected_version )); then
              selected_xcode="$candidate_dir"
              selected_version="$candidate_version"
            fi
          done
          [[ -n "$selected_xcode" ]] || { echo "Xcode 26+ is required" >&2; exit 1; }
          echo "DEVELOPER_DIR=$selected_xcode" >> "$GITHUB_ENV"
      - name: Install tvOS platform support
        run: |
          sudo env DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -runFirstLaunch
          xcodebuild -downloadPlatform tvOS
      - name: Show selected Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build unsigned tvOS application
        run: bash BuildScripts/build-tvos.sh '${{ matrix.configuration }}'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-${{ matrix.configuration }}-diagnostics
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: ignore
      - name: Upload unsigned device app
        uses: actions/upload-artifact@v4
        with:
          name: tvos-${{ matrix.configuration }}-unsigned
          path: build/DerivedData/Build/Products/${{ matrix.configuration }}-appletvos/*.app
          if-no-files-found: error
